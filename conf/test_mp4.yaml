# ============================================================================
# mp4 输入测试配置（无摄像头时联调用）
#
# 用法：./build/rk3568_vision -c conf/test_mp4.yaml
#
# 与 conf/default.yaml 的唯一区别是 capture.source=mp4：用 data/test.mp4 循环
# 播放作为视频源，跑通「采集 → 稳帧 → 推理 → 编码 → RTMP 推流」整条流水线，
# 用于在摄像头不可用时先验证全链路。
# ============================================================================

# 视频采集：source=mp4，用 FFmpeg 解码 data/test.mp4 转 NV12 循环输出
capture:
  source: mp4
  device: /dev/video0
  file: data/test.mp4
  width: 1280
  height: 720
  fps: 25
  buffer_count: 6
  use_mplane: true

# RKNN 推理（YOLOv5 relu 版 INT8，输出已是 sigmoid 后值，后处理不再 sigmoid）
inference:
  enabled: true
  model_path: model/yolov5s_relu.rknn
  labels_path: model/coco_80_labels_list.txt
  conf_threshold: 0.25
  nms_threshold: 0.45
  model_width: 640
  model_height: 640
  npu_core: 0
  use_sigmoid: false    # relu 模型输出已是 sigmoid 后值；换标准 yolov5s 时改为 true

# 稳帧器（帧率稳定节拍）
pacer:
  target_fps: 25
  allow_duplicate: true

# 编码：hardware=true 需 Rockchip FFmpeg 分支(h264_rkmpp)；当前板端用软编
# 注：实际帧率受推理/编码瓶颈影响（mp4 约 10fps、摄像头约 4fps），gop_size 不宜
# 太大，否则关键帧间隔过长，拉流端迟迟等不到 IDR 出画面。设 10 保证关键帧 ≤2.5 秒
encode:
  hardware: false
  bitrate: 2000000
  gop_size: 10
  preset: fast
  profile: high

# RTMP 推流（mediamtx 部署在板端，流水线推流到板端本机 1935）
stream:
  enabled: true
  url: rtmp://127.0.0.1:1935/live/stream
  reconnect: true
  reconnect_delay_ms: 2000
  max_reconnect: -1

# 本地 MP4 录制
record:
  enabled: false
  path: output/record.mp4

# 监控日志间隔（毫秒）
monitor_interval_ms: 5000

# 日志
logging:
  level: info
  file: log/rk3568_vision.log
  console: true
  async: true
  max_size: 10485760
  backup_count: 3
