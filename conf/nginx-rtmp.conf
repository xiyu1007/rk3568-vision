# ============================================================================
# nginx-rtmp.conf — 板端 RTMP 服务器配置
# ============================================================================
#
# 部署位置：板端 nginx 安装目录下的 conf/nginx.conf
#   （默认 /home/gx/project/gx/rk3568-vision/third_lib/nginx-1.24.0/install/conf/nginx.conf）
#
# 用法：
#   把本文件内容替换到板端 nginx.conf，然后 sudo nginx -s reload
#
# 推流：板端流水线 → rtmp://127.0.0.1:1935/live/stream（只允许本机推流）
# 拉流：虚拟机/Windows → rtmp://<板端IP>:1935/live/stream（允许所有客户端播放）
# ============================================================================

worker_processes 1;

events {
    worker_connections 1024;
}

# RTMP 流媒体模块
rtmp {
    server {
        listen 1935;          # RTMP 默认端口
        chunk_size 4096;

        application live {    # 推流地址：rtmp://<板端IP>/live/stream
            live on;          # 开启直播
            allow publish 127.0.0.1;   # 只允许本机（板端流水线）推流
            allow play all;            # 允许所有客户端拉流
            record off;                # 不落盘（由流水线负责录制）
        }
    }
}

# HTTP 模块（可选，保留默认配置）
http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name localhost;
        location / {
            root html;
            index index.html index.htm;
        }
    }
}
