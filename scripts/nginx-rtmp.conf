# ============================================================================
# nginx-rtmp.conf — 本地 RTMP 服务器最小配置
# ============================================================================
#
# 用途：在 x86 开发机（WSL）上启动一个本地 RTMP 服务器，用于验证
#       "rk3568-vision → RTMP → ffplay 拉流" 的整条推流链路。
#
# 前提：nginx 已编译 rtmp 模块（--add-module=nginx-rtmp-module）。
#
# 启动方式：
#   sudo nginx -c $(pwd)/scripts/nginx-rtmp.conf -p /tmp/nginx-rtmp
# 拉流验证：
#   ffplay rtmp://127.0.0.1/live/stream
# ============================================================================

worker_processes  1;

events {
    worker_connections  1024;
}

rtmp {
    server {
        listen 1935;          # RTMP 默认端口
        chunk_size 4096;

        application live {    # 应用名 = url 里的 /live
            live on;          # 开启直播
            record off;       # 不落盘（由 rk3568 侧负责录制）
        }
    }
}

# 可选：HTTP 状态页（浏览器访问 http://127.0.0.1:8080/stat 查看推流状态）
http {
    server {
        listen 8080;
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }
        location / {
            root html;
        }
    }
}
